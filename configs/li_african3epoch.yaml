description: The three epoch (modern, bottleneck, ancestral) model estimated for two Drosophila Melanogaster populations - African (ancestral) and European (derived) from Li and Stephan (2006)
doi:
  - https://doi.org/10.1371/journal.pgen.0020166
time_units: generations
mutation_rate: 1.45e-9
demes:
  - name: AFR
    description: African D. melanogaster population
    epochs:
      - start_size: 1720600
        end_time: 600000
      - start_size: 8603000
        end_time: 0
  - name: EUR
    description: European D. melanogaster population
    epochs:
      - start_size: 2200
        end_time: 154600
      - start_size: 1075000
        end_time: 0

pulses:
- {sources: [EUR], dest: AFR, time: 158000, proportions: [1]}
