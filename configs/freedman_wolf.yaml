description: Demographic model of dog domestication with the Boxer reference genome, two basal dog breeds, three wolves, and a golden jackal (outgroup) from Freedman et al. (2014)
doi:
  - https://doi.org/10.1371/journal.pgen.1004016
mutation_rate: 1e-8
time_units: generations

demes:
  - name: Ancestral_dog_wolf_Golden_jackal_root
    epochs:
      - start_size: 18169
        end_time: 398262

  - name: Ancestral_dog_wolf
    ancestors: [Ancestral_dog_wolf_Golden_jackal_root]
    epochs:
      - start_size: 44993
        end_time: 14874
  
  - name: Ancestral_Israeli_Croatian_Chinese_wolf
    ancestors: [Ancestral_dog_wolf]
    epochs:
      - start_size: 12627
        end_time: 13455

  - name: Ancestral_Israeli_Croatian_wolf
    ancestors: [Ancestral_Israeli_Croatian_Chinese_wolf]
    epochs:
      - start_size: 1393
        end_time: 13389
  
  - name: Ancestral_Boxer_Basenji_Dingo
    ancestors: [Ancestral_dog_wolf]
    epochs:
      - start_size: 1999
        end_time: 12795

  - name: Basenji
    ancestors: [Ancestral_Boxer_Basenji_Dingo]
    epochs:
      - end_time: 0
        start_size: 2639

  - name: Dingo
    ancestors: [Ancestral_Boxer_Basenji_Dingo]
    epochs:
      - end_time: 0
        start_size: 1914

  - name: Chinese_wolf
    ancestors: [Ancestral_Israeli_Croatian_Chinese_wolf]
    epochs:
      - end_time: 0
        start_size: 5426

  - name: Israeli_wolf
    ancestors: [Ancestral_Israeli_Croatian_wolf]
    epochs:
      - end_time: 0
        start_size: 26092

  - name: Croatian_wolf
    ancestors: [Ancestral_Israeli_Croatian_wolf]
    epochs:
      - end_time: 0
        start_size: 11427

  - name: Golden_jackal
    ancestors: [Ancestral_dog_wolf_Golden_jackal_root]
    epochs:
      - end_time: 0
        start_size: 19446

migrations:
  - source: Israeli_wolf
    dest: Basenji
    rate: 0.18

  - source: Basenji
    dest: Israeli_wolf
    rate: 0.07

  - source: Chinese_wolf
    dest: Dingo
    rate: 0.03

  - source: Dingo
    dest: Chinese_wolf
    rate: 0.04

  - source: Israeli_wolf
    dest: Golden_jackal
    rate: 0.05

  - source: Golden_jackal
    dest: Ancestral_dog_wolf
    rate: 0.02

  - source: Ancestral_dog_wolf
    dest: Golden_jackal
    rate: 0.99