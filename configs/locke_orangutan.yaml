description: The two orang-utan species, Sumatran (Pongo abelii) and Bornean (Pongo pygmaeus) inferred from the joint-site frequency spectrum with ten individuals from each population
doi:
  - http://doi.org/10.1038/nature09687
mutation_rate: 2e-8
time_units: generations
demes:
  - name: Ancestral
    epochs:
      - start_size: 17934
        end_time: 20157
  - name: Bornean
    description: Pongo pygmaeus (Bornean) population
    ancestors: [Ancestral]
    epochs:
      - start_size: 10617
        end_size: 8805
        end_time: 0
  - name: Sumatran
    description: Pongo abelii (Sumatran) population
    ancestors: [Ancestral]
    epochs:
      - start_size: 7317
        end_size: 37661
        end_time: 0

migrations:
  - source: Bornean
    dest: Sumatran
    rate: 0.67e-5

  - source: Sumatran
    dest: Bornean
    rate: 1.1e-5

