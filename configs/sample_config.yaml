sample_size: 20
num_replicates: 5
population_size: 1000
sequence_length: 100
recombination_rate: 0.00001
mutation_rate: 0.000001
gene_conversion_rate: 0.00001
gene_conversion_tract_length: 1
ms_path: C:/Users/Lenovo/OneDrive/Dokumente/Informatik-Studium/KIT/Masterarbeit/ms.folder/ms/msdir/ms.exe
ms_output_file: results/ms_output.txt
msprime_output_file: results/msprime_output.txt

populations:
  - name: pop1
    initial_size: 500
    sample_size: 5
    growth_rate: 0.002
  - name: pop2
    initial_size: 200
    sample_size: 5
  - name: pop3
    initial_size: 800
  - name: pop4
    initial_size: 800
  - name: pop5
    initial_size: 800

migration_rates:
  - source: pop1
    dest: pop2
    rate: 0.1
  - source: pop2
    dest: pop1
    rate: 0.1
  - source: pop4
    dest: pop5
    rate: 0.1
  - source: pop5
    dest: pop4
    rate: 0.1

demography_events:
  - type: size_change
    time: 10
    population: pop1
    size: 1000

  - type: growth_rate_change
    time: 50
    population: pop2
    rate: 0.003

  - type: migration_rate_change
    time: 100
    source: pop1
    dest: pop2
    rate: 0.2

  - type: population_split
    time: 150
    derived: [pop1, pop2]
    ancestral: pop3