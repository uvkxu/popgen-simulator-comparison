description: This is the best-fitting model of a history of multiple ancient and present-day human populations sampled across Eurasia over the past 120,000 years.
doi:
  - https://doi.org/10.1080/01621459.2019.1635482
mutation_rate: 1.22e-8
time_units: years
generation_time: 25

demes:
  - name: Ancestral
    description: Ancestor of WHG and Neanderthal
    epochs:
      - start_size: 18200
        end_time: 696000
  - name: WHG
    description: Western hunter-gatherer
    ancestors: [Ancestral]
    epochs:
      - start_size: 1920
        end_time: 0
  - name: Mbuti
    description: Present-day African Mbuti
    ancestors: [WHG]
    start_time: 95800
    epochs:
      - start_size: 17300
        end_time: 0
  - name: EEF
    description: Early European farmer
    ancestors: [WHG]
    start_time: 37700
    epochs:
      - start_size: 75.7
        end_time: 0
  - name: Sardinian
    description: Present-day Sardinian
    ancestors: [EEF]
    start_time: 7690
    epochs:
      - start_size: 15000
        end_time: 0
  - name: MA
    description: Upper Palaeolithic MAlta culture
    ancestors: [WHG]
    start_time: 44900
    epochs:
      - start_size: 1920
        end_time: 0
  - name: UstIshim
    description: early Palaeolithic Ust-Ishim
    ancestors: [WHG]
    start_time: 51500
    epochs:
      - start_size: 1920
        end_time: 0
  - name: Han
    description: Present-day Han Chinese
    ancestors: [WHG]
    start_time: 50400
    epochs:
      - start_size: 6300
        end_time: 0
  - name: Neanderthal
    description: Altai Neanderthal from Siberia
    ancestors: [Ancestral]
    epochs:
      - start_size: 18200
        end_time: 95800
      - start_size: 18200
        end_size: 86.9
        end_time: 0
  - name: Basal
    description: Basal Eurasians
    ancestors: [WHG]
    start_time: 79800
    epochs:
      - start_size: 1920
        end_time: 0


pulses:
- {dest: WHG, sources: [Neanderthal], time: 56800, proportions: [0.0296]}
- {dest: EEF, sources: [Basal], time: 33700, proportions: [0.0936]}
- {dest: Sardinian, sources: [WHG], time: 1230, proportions: [0.0317]}